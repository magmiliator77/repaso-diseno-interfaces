<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Acceso privado</title>
<style>
:root{--bg:#f5f7fb;--paper:#fff;--ink:#18213a;--muted:#56607a;--line:#dde2ee;--accent:#2747c9;--bad:#b4322c;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#10141f;--paper:#171c2a;--ink:#e7eaf3;--muted:#a2aac0;--line:#2a3145;--accent:#8ea4ff;--bad:#ff8f86;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,sans-serif;display:grid;place-items:center;padding:16px}
form{width:100%;max-width:360px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:24px;display:grid;gap:12px}
h1{font-size:20px;margin:0}
p{margin:0;color:var(--muted);font-size:14px}
label{font-weight:600;font-size:14px}
input{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);width:100%}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:600 15px inherit;font-family:inherit;padding:10px;border:0;border-radius:6px;background:var(--accent);color:var(--paper);cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#err{color:var(--bad);min-height:1.5em}
</style>
</head>
<body>
<form id="f" autocomplete="off">
  <h1>Acceso privado</h1>
  <p>Introduce la contraseña para ver el contenido.</p>
  <label for="pw">Contraseña</label>
  <input id="pw" type="password" required autofocus>
  <button id="go" type="submit">Entrar</button>
  <p id="err" role="alert"></p>
</form>

async function abrir(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw.normalize('NFC')),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(D.s),iterations:D.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(D.i)},key,b64(D.c));
  return new TextDecoder().decode(pt);
}

  if(!(window.crypto&&crypto.subtle)){err.textContent='Este navegador no permite descifrar aquí. Abre la web con https://.';return}
  go.disabled=true; err.textContent='Comprobando…';
  try{
    const html=await abrir(pw.value);
    document.open(); document.write(html); document.close();
  }catch(_){
    err.textContent='Contraseña incorrecta.'; pw.value=''; pw.focus(); go.disabled=false;
  }
});
</script>
